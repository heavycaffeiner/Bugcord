[versions]
# Version of the build plugin published by the upstream project we forked from.
bugcord-gradle = "2.3.0"
bugcordhook = "1.1.4"
bugcordwebrtc = "1.0.1"
android-gradle = "8.13.2"
desugar = "2.1.5"
discord = "126021"
dokka = "2.1.0"
kotlin = "2.3.0"
#noinspection GradleDependency
kotlin-stdlib = "1.5.21"
publish = "0.36.0"
smali = "3.0.9"

#noinspection GradleDependency
appcompat = "1.4.1"
#noinspection GradleDependency
constraintlayout = "2.1.4"
#noinspection GradleDependency
material = "1.5.0"

[libraries]
bugcordhook = { module = "com.bugcord:Bugcordhook", version.ref = "bugcordhook" }
bugcordwebrtc = { module = "com.bugcord:Bugcordwebrtc", version.ref = "bugcordwebrtc" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
discord = { module = "com.discord:discord", version.ref = "discord" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
material = { module = "com.google.android.material:material", version.ref = "material" }
smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }

[plugins]
bugcord-core = { id = "com.aliucord.core", version.ref = "bugcord-gradle" }
bugcord-injector = { id = "com.aliucord.injector", version.ref = "bugcord-gradle" }
android-library = { id = "com.android.library", version.ref = "android-gradle" }
dokka-html = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
