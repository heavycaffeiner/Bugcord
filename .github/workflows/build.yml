name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      coreDeploy: ${{ steps.compare.outputs.coreDeploy }}
      patchesDeploy: ${{ steps.compare.outputs.patchesDeploy }}
      injectorDeploy: ${{ steps.compare.outputs.injectorDeploy }}
      kotlinDeploy: ${{ steps.compare.outputs.kotlinDeploy }}
      voiceDeploy: ${{ steps.compare.outputs.voiceDeploy }}
      coreVersion: ${{ steps.compare.outputs.coreVersion }}
      patchesVersion: ${{ steps.compare.outputs.patchesVersion }}
      injectorVersion: ${{ steps.compare.outputs.injectorVersion }}
      kotlinVersion: ${{ steps.compare.outputs.kotlinVersion }}
      voiceVersion: ${{ steps.compare.outputs.voiceVersion }}
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout builds
        # The branch does not exist on a fresh fork, so it is created empty on first run
        run: |
          git init -q builds
          git -C builds remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git -C builds fetch --depth 1 origin builds:refs/remotes/origin/builds; then
            git -C builds checkout -q -b builds --track origin/builds
          else
            echo "No builds branch yet, treating every component as undeployed"
          fi
          mkdir -p builds

      - name: Compare deployed versions
        id: compare
        run: |
          # Extract new versions
          coreVersion="$(cat $GITHUB_WORKSPACE/src/Bugcord/build.gradle.kts | grep -E 'version = "' | cut -d '"' -f 2)"
          patchesVersion="$(cat $GITHUB_WORKSPACE/src/patches/build.gradle.kts | grep -E 'version = "' | cut -d '"' -f 2)"
          injectorVersion="$(cat $GITHUB_WORKSPACE/src/Injector/build.gradle.kts | grep -E 'version = "' | cut -d '"' -f 2)"
          kotlinVersion="$(cat $GITHUB_WORKSPACE/src/gradle/libs.versions.toml | grep -E 'kotlin-stdlib = "' | cut -d '"' -f 2)"
          # The voice library ships with the core build and is versioned with it
          voiceVersion="$coreVersion"

          # Extract current deployed versions, missing on the first run
          data="$GITHUB_WORKSPACE/builds/data.json"
          coreVersionOld="$(jq -r '.coreVersion // "none"' "$data" 2>/dev/null || echo none)"
          patchesVersionOld="$(jq -r '.patchesVersion // "none"' "$data" 2>/dev/null || echo none)"
          injectorVersionOld="$(jq -r '.injectorVersion // "none"' "$data" 2>/dev/null || echo none)"
          kotlinVersionOld="$(jq -r '.kotlinVersion // "none"' "$data" 2>/dev/null || echo none)"
          voiceVersionOld="$(jq -r '.voiceVersion // "none"' "$data" 2>/dev/null || echo none)"

          # Determine whether deployments are required
          coreDeploy=$([ "$coreVersion" != "$coreVersionOld" ] && echo true || echo false)
          patchesDeploy=$([ "$patchesVersion" != "$patchesVersionOld" ] && echo true || echo false)
          injectorDeploy=$([ "$injectorVersion" != "$injectorVersionOld" ] && echo true || echo false)
          kotlinDeploy=$([ "$kotlinVersion" != "$kotlinVersionOld" ] && echo true || echo false)
          voiceDeploy=$([ "$voiceVersion" != "$voiceVersionOld" ] && echo true || echo false)

          # Write step output
          echo "coreVersion=$coreVersion" >> "$GITHUB_OUTPUT"
          echo "patchesVersion=$patchesVersion" >> "$GITHUB_OUTPUT"
          echo "injectorVersion=$injectorVersion" >> "$GITHUB_OUTPUT"
          echo "kotlinVersion=$kotlinVersion" >> "$GITHUB_OUTPUT"
          echo "voiceVersion=$voiceVersion" >> "$GITHUB_OUTPUT"
          echo "coreDeploy=$coreDeploy" >> "$GITHUB_OUTPUT"
          echo "patchesDeploy=$patchesDeploy" >> "$GITHUB_OUTPUT"
          echo "injectorDeploy=$injectorDeploy" >> "$GITHUB_OUTPUT"
          echo "kotlinDeploy=$kotlinDeploy" >> "$GITHUB_OUTPUT"
          echo "voiceDeploy=$voiceDeploy" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ inspect ]
    if: ${{ !cancelled() }} # Allow build when `inspect` job skipped
    permissions:
      contents: read
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-write-only: ${{ needs.inspect.outputs.coreDeploy == 'true' }} # Disable using cache when deploying

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Fetch the prebuilt toolchain
        run: |
          chmod +x tools/fetch-toolchain.sh
          ./tools/fetch-toolchain.sh

      - name: Stage the Discord APK
        run: ./gradlew prepareDiscordApk

      - name: Build project
        env:
          RELEASE: ${{ needs.inspect.outputs.coreDeploy == 'true' }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace \
            :Bugcord:make :Injector:make :kotlin-stdlib:make \
            :voice:publishToMavenLocal \
            :patches:package :patches:disassembleWithPatches :patches:testPatches
          cp "$HOME/.m2/repository/com/bugcord/Bugcordvoice/1.0.0/Bugcordvoice-1.0.0.aar" \
             "$GITHUB_WORKSPACE/Bugcordvoice.aar"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Bugcord/build/outputs/Bugcord.zip
            ${{ github.workspace }}/Injector/build/outputs/Injector.dex
            ${{ github.workspace }}/patches/build/outputs/patches.zip
            ${{ github.workspace }}/kotlin-stdlib/build/outputs/kotlin.dex
            ${{ github.workspace }}/Bugcordvoice.aar

      - name: Deploy documentation
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        shell: bash # GLOBIGNORE is unique to bash
        env:
          DOCS_REPO: thirdscam/Bugcord-dokka
          API_TOKEN: ${{ secrets.API_PAT_GITHUB }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "No API_PAT_GITHUB secret configured, skipping documentation deploy"
            exit 0
          fi

          # Generate docs
          ./gradlew :Bugcord:dokkaGenerateHtml

          # Clone docs repo
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git clone https://$USERNAME:$API_TOKEN@github.com/$DOCS_REPO.git docs
          cd docs

          # Clean and update docs repo
          GLOBIGNORE=README.md:.git   # do not glob README and .git
          rm -rf *
          cp -r ../Bugcord/build/dokka/* .

          # Commit docs changes
          git add .
          git commit -m "Build https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" || exit 0
          git push https://$USERNAME:$API_TOKEN@github.com/$DOCS_REPO.git

      - name: Publish Snapshots to Maven
        if: ${{ github.event_name != 'pull_request'
          && env.MAVEN_SNAPSHOTS_USERNAME != ''
          && env.MAVEN_SNAPSHOTS_PASSWORD != '' }}
        env:
          MAVEN_SNAPSHOTS_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_SNAPSHOTS_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          hash_version="$(git rev-parse --short "$GITHUB_SHA")"
          branch_version="$(echo "$GITHUB_REF_NAME" | sed 's/\//-/g')-SNAPSHOT"
          echo "Publishing snapshot with versions $hash_version and $branch_version"

          ./gradlew --stacktrace -PVERSION_NAME="$hash_version" \
              :Bugcord:publishAllPublicationsToBugcordSnapshotsRepository
          ./gradlew --stacktrace -PVERSION_NAME="$branch_version" \
              :Bugcord:publishAllPublicationsToBugcordSnapshotsRepository

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [ inspect, build ]
    if: ${{ github.ref == 'refs/heads/main' && (
      needs.inspect.outputs.coreDeploy == 'true' ||
      needs.inspect.outputs.injectorDeploy == 'true' ||
      needs.inspect.outputs.patchesDeploy == 'true' ||
      needs.inspect.outputs.kotlinDeploy == 'true' ||
      needs.inspect.outputs.voiceDeploy == 'true' ) }}
    permissions:
      contents: write
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout builds
        # The branch does not exist on a fresh fork, so it is created as an orphan on first run
        run: |
          git init -q builds
          git -C builds remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git -C builds fetch --depth 1 origin builds:refs/remotes/origin/builds; then
            git -C builds checkout -q -b builds --track origin/builds
          else
            git -C builds checkout -q --orphan builds
          fi
          git -C builds config user.email "actions@github.com"
          git -C builds config user.name "GitHub Actions"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: artifacts

      - name: Deploy builds
        run: |
          # Flatten downloaded artifacts; files already at the top level stay put
          find $GITHUB_WORKSPACE/artifacts -mindepth 2 -type f -exec mv -t $GITHUB_WORKSPACE/artifacts '{}' +

          # Copy over builds if version changed
          [ "${{ needs.inspect.outputs.coreDeploy }}" == "true" ] && cp $GITHUB_WORKSPACE/artifacts/Bugcord.zip $GITHUB_WORKSPACE/builds
          [ "${{ needs.inspect.outputs.injectorDeploy }}" == "true" ] && cp $GITHUB_WORKSPACE/artifacts/Injector.dex $GITHUB_WORKSPACE/builds
          [ "${{ needs.inspect.outputs.patchesDeploy }}" == "true" ] && cp $GITHUB_WORKSPACE/artifacts/patches.zip $GITHUB_WORKSPACE/builds
          [ "${{ needs.inspect.outputs.kotlinDeploy }}" == "true" ] && cp $GITHUB_WORKSPACE/artifacts/kotlin.dex $GITHUB_WORKSPACE/builds
          [ "${{ needs.inspect.outputs.voiceDeploy }}" == "true" ] && cp $GITHUB_WORKSPACE/artifacts/Bugcordvoice.aar $GITHUB_WORKSPACE/builds

          # Write versions to data.json
          # `bugcordHash` is kept to force old builds to update (when versions were tied to a commit hash)
          jq '. + { coreVersion: $cv, injectorVersion: $iv, patchesVersion: $pv, kotlinVersion: $kv, voiceVersion: $vv, bugcordHash: "0000000" }' \
             --arg cv "${{ needs.inspect.outputs.coreVersion }}" \
             --arg iv "${{ needs.inspect.outputs.injectorVersion }}" \
             --arg pv "${{ needs.inspect.outputs.patchesVersion }}" \
             --arg kv "${{ needs.inspect.outputs.kotlinVersion }}" \
             --arg vv "${{ needs.inspect.outputs.voiceVersion }}" \
             $GITHUB_WORKSPACE/src/.assets/data.json > $GITHUB_WORKSPACE/builds/data.json

          # Commit and push
          cd $GITHUB_WORKSPACE/builds
          git add .
          if [[ `git status --porcelain` ]]; then
            git commit -m "Build $GITHUB_SHA"
            if git rev-parse --abbrev-ref --symbolic-full-name '@{u}' > /dev/null 2>&1; then
              git push
            else
              git push -u origin builds
            fi
          fi

  #   - name: Wait for GitHub Pages
  #     run: sleep 2m

  #   # Proxying through Cloudflare is not currently enabled
  #   - name: Purge Cloudflare cache
  #     uses: jakejarvis/cloudflare-purge-action@v0.3.0
  #     env:
  #       CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
  #       CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
  #       PURGE_URLS: |
  #         [
  #           "https://raw.githubusercontent.com/thirdscam/Bugcord/builds/data.json",
  #           "https://raw.githubusercontent.com/thirdscam/Bugcord/builds/Bugcord.zip",
  #           "https://raw.githubusercontent.com/thirdscam/Bugcord/builds/Injector.dex",
  #           "https://raw.githubusercontent.com/thirdscam/Bugcord/builds/patches.zip"
  #         ]

  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ inspect ]
    if: ${{ github.ref == 'refs/heads/main'
      && needs.inspect.outputs.coreDeploy == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-write-only: true

      - name: Build & Publish to Maven releases
        env:
          MAVEN_RELEASES_USERNAME: ${{ secrets.MAVEN_RELEASES_USERNAME }}
          MAVEN_RELEASES_PASSWORD: ${{ secrets.MAVEN_RELEASES_PASSWORD }}
        run: |
          if [ -z "$MAVEN_RELEASES_USERNAME" ] || [ -z "$MAVEN_RELEASES_PASSWORD" ]; then
            echo "No Maven release credentials configured, skipping publish"
            exit 0
          fi

          chmod +x gradlew
          ./gradlew --stacktrace :Bugcord:publishAllPublicationsToBugcordRepository
